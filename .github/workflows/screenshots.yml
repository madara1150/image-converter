name: Screenshots

on:
  push:
    branches: [main]
    paths: ["gui.py", "image_converter.py", "tools/screenshot.py", "assets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take screenshots
        run: |
          python tools/screenshot.py docs/screenshot-light.png light en
          python tools/screenshot.py docs/screenshot-dark.png dark en
          python tools/screenshot.py docs/screenshot-th.png light th

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push
