name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ImageConverter-Windows.zip
          - os: macos-latest
            asset: ImageConverter-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: ImageConverter-macOS-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --noupx --icon assets/icon.ico --add-data assets:assets --collect-data customtkinter --collect-all tkinterdnd2 --name ImageConverter --version-file version_info.txt image_converter.py
          Compress-Archive -Path dist\ImageConverter -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --noupx --icon assets/icon.png --add-data assets:assets --collect-data customtkinter --collect-all tkinterdnd2 --name ImageConverter --osx-bundle-identifier com.imageconverter.app image_converter.py
          codesign --force --deep --sign - dist/ImageConverter.app
          ditto -c -k --keepParent dist/ImageConverter.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
