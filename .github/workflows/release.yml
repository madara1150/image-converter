name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYI_FLAGS: --noconfirm --clean --windowed --onedir --noupx --add-data assets:assets --collect-data customtkinter --collect-all tkinterdnd2 --name ImageConverter

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            dmg: ImageConverter-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            dmg: ImageConverter-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller $env:PYI_FLAGS.Split(' ') --icon assets/icon.ico --version-file version_info.txt image_converter.py
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$iscc\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH += ";$iscc"
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d') { $version = "0.0.0" }
          iscc /DAppVersion=$version installer.iss
          Compress-Archive -Path dist\ImageConverter -DestinationPath ImageConverter-Windows-Portable.zip
          New-Item -ItemType Directory release | Out-Null
          Move-Item Output\ImageConverter-Setup-Windows.exe release\
          Move-Item ImageConverter-Windows-Portable.zip release\

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller $PYI_FLAGS --icon assets/icon.png --osx-bundle-identifier com.imageconverter.app image_converter.py
          codesign --force --deep --sign - dist/ImageConverter.app
          mkdir release
          ./make_dmg.sh release/${{ matrix.dmg }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
